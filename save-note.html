<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>長按儲存設計筆記</title><style>body{margin:0;background:#f2f2ed;color:#243445;font:16px/1.8 system-ui,sans-serif}main{padding:18px;max-width:1100px;margin:auto}a{color:#3056d3}p{margin:10px 0}img{display:block;width:100%;height:auto;background:white;touch-action:auto;-webkit-touch-callout:default!important;-webkit-user-select:auto!important;user-select:auto!important;pointer-events:auto}h1{font-size:23px}small{color:#657080}</style></head><body><main><a href="index.html">← 返回設計筆記</a><h1>長按下方圖片儲存</h1><p>手機長按圖片，選擇「儲存影像」或「下載圖片」；電腦可按右鍵另存圖片。</p><p><small>若 App 內的預覽沒有長按選單，請用 Safari／Chrome 開啟原網站，在「設計筆記」重新產生圖片。此頁需使用同一瀏覽器與分頁開啟。</small></p><div id="image"></div></main><script>try{const src=sessionStorage.getItem('mermer-note-image');if(!src||!/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(src))throw Error();const image=document.createElement('img');image.src=src;image.alt='可長按儲存的完整包裝配色設計筆記';image.draggable=false;document.getElementById('image').appendChild(image)}catch(e){document.getElementById('image').textContent='此分頁尚未有筆記圖片。請返回「設計筆記」，等待圖片產生後再開啟。'}</script></body></html>
