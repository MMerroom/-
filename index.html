r{display:grid;grid-template-columns:60px 1fr 50px;align-items:center;gap:10px;font-size:13px;margin-top:10px}.toneTips{background:#f8f6ef;border-radius:10px;padding:14px;font-size:13px;margin-top:18px}.toneTips p{margin:6px 0}.note{font-size:13px;color:var(--muted)}.success{color:#37654b}.report{border-top:5px solid var(--blue);background:#fff;padding:26px;border-radius:10px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.report h3{margin-top:22px}.report p{white-space:pre-wrap;font-size:14px}.report .grid{gap:15px}.status{font-size:12px;min-height:20px;color:var(--green)}.empty{color:#8c929c}.footer{margin-top:30px;color:#8c929c;font-size:11px}.mobileProgress{display:none}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#243445;color:white;padding:12px 22px;border-radius:12px;z-index:30;max-width:90vw;font-size:14px;box-shadow:0 5px 30px #0003} [hidden]{display:none!important}@media(max-width:1050px){.shell{grid-template-columns:190px 1fr}.workspace{padding:28px 24px}.card{padding:20px}.grid{gap:16px}}@media(max-width:760px){header{padding:15px 20px}.topnote{display:none}.shell{display:block}aside{padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}aside>.eyebrow,.asidebox{display:none}.steps{display:flex;overflow-x:auto;gap:5px;margin:0}.step{width:auto;flex-shrink:0;padding:9px;font-size:12px}.step small{display:none}.step b{width:24px;height:24px}.workspace{padding:24px 16px 40px}.grid{grid-template-columns:1fr}.card{padding:18px}.grid3{gap:7px}.roleCard{padding:8px}.preview{min-height:0}.compare{grid-template-columns:1fr 1fr;gap:10px}.compare .preview{padding:12px 4px;min-height:0}.previewTitle{font-size:15px}.btn{padding:10px 12px}.report{padding:18px}.report .compare{grid-template-columns:1fr}.mobileProgress{display:block;font-size:11px;color:var(--muted);margin-top:8px}}@media print{header,aside,.navfoot,.noprint,.footer{display:none!important}.shell{d <div class="shell"><aside><div class="eyebrow">FROM COLOR TO CONCEPT</div><nav class="steps" aria-label="學習步驟"></nav><div class="asidebox"><p>觀察、試色，再說明你的決定。</p><p>圖片只在此瀏覽器內處理。內容自動暫存於這台裝置的此瀏覽器，換裝置請匯出進度檔。</p><button class="linkbtn" id="backup">匯出進度檔</button><br><button class="linkbtn" id="restoreBtn">匯入進度檔</button><br><button class="linkbtn" id="demoBtn">載入示範內容</button><br><button class="linkbtn" id="clearBtn">清除本機紀錄</button></div></aside>
<main class="workspace"><div class="eyebrow" id="stepTag"></div><h1 id="heading"></h1><p class="lead" id="intro"></p><div id="content"></div><div class="navfoot"><button class="btn" id="prev">← 上一步</button><button class="btn primary" id="next">下一步 →</button></div><div class="footer">MerMer room · 基本設計教學工具　｜　色彩感受可因情境與個人經驗而不同。<div class="row" style="margin-top:10px"><button class="linkbtn" onclick="document.getElementById('backup').click()">下載進度</button><button class="linkbtn" onclick="document.getElementById('restoreBtn').click()">匯入進度</button><button class="linkbtn" onclick="document.getElementById('demoBtn').click()">觀看示範</button></div></div></main></div><input id="restoreFile" type="file" accept="application/json,.json" hidden><div id="toast" role="status" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='mermer-packaging-v1', names=['觀察原包裝','配色與聯想','設定兩個新版本','雙方案試色','設計筆記'], subtitles=['辨識主色、輔色與點綴色','讓聯想有色彩依據','口味、族群與形象','調整色相、明度與彩度','整理理由，帶回紙上創作'];
function defaults(){return {v:2,step:0,originalName:'',photo:'',palette:[],selectedColor:'#a99cdb',originalColors:['#f1c945','#f7f6ed','#508549'],ratios:[60,30,10],associations:{sense:'',audience:'',style:'',emotion:'',temperature:''},plans:[{version:'',audience:'',scene:'',intent:'',name:'',colors:['#b7a3e0','#f8f6ee','#c0d945'],colorNames:['淡紫色','米白色','黃綠色'],ratios:[60,30,10],mainEffect:'',mixEffect:''},{version:'',audience:'',scene:'',intent:'',name:'',colors:['#543747','#e2dcd3','#ad9352'],colorNames:['深灰紫色','暖灰色','赭黃色'],ratios:[60,30,10],mainEffect:'',mixEffect:''}],activePlan:0,activeRole:0,gray:false,student:'',className:''}}
function normalizeProgress(a){let base=defaults();return {...base,...a,v:2,gray:false,plans:base.plans.map((p,i)=>({...p,...a.plans?.[i],version:a.plans?.[i]?.version??a.version??'',audience:a.plans?.[i]?.audience??a.audience??'',scene:a.plans?.[i]?.scene??a.scene??''}))}}
let s=defaults(),img=null,crop=null,drag=null,pickMode=false,saveTimer;
try{const a=JSON.parse(localStorage.getItem(KEY));if(a&&(a.v===1||a.v===2))s=normalizeProgress(a)}catch(e){}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(s));$('#saveStatus').textContent='已暫存於此瀏覽器'}catch(e){$('#saveStatus').textContent='暫存空間不足，請下載進度檔'}},250)}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4000)}
function field(label,key,value,placeholder='',textarea=false){let id='field-'+key.replaceAll('.','-');return `<label for="${id}">${label}</label>`+(textarea?`<textarea id="${id}" data-key="${key}" maxlength="800" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input type="text" id="${id}" data-key="${key}" maxlength="160" placeholder="${esc(placeholder)}" value="${esc(value)}">`)}
function bindFields(){ $$('[data-key]').forEach(el=>el.addEventListener('input',()=>{let o=s,a=el.dataset.key.split('.');for(let i=0;i<a.length-1;i++)o=o[a[i]];o[a.at(-1)]=el.value;save();if(s.step===2)updateTargetSummary();if(s.step===4){if($('#reportStudent'))$('#reportStudent').textContent=[s.className,s.student].filter(Boolean).join('　')||'基本設計｜生活中的色彩';scheduleNoteImage(450)}}));}
function go(n){s.step=Math.max(0,Math.min(4,n));render();save();window.scrollTo({top:0,behavior:'smooth'})}
function render(){ $('.steps').innerHTML=names.map((n,i)=>`<button class="step ${s.step===i?'active':''}" data-go="${i}" ${s.step===i?'aria-current="step"':''}><b>${i+1}</b><span>${n}<small>${subtitles[i]}</small></span></button>`).join('');$$('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));$('#stepTag').textContent=`STEP 0${s.step+1} / 05`;$('#heading').textContent=names[s.step];$('#intro').textContent=[ '從真實商品開始，找出配色的角色與面積分配。先觀察，再為新版本做設計。','根據商品的配色展開聯想，寫下感受，也指出支持這個感受的色彩特徵。','分別設定 A、B 的新口味或主題、對象與情境，再為每個版本做配色決定。','依照各版本的口味或主題調整配色，讓特色容易辨識，再以明度、彩度與面積塑造各自的形象。','將觀察、試色與設計理由整理在一起，下載後參照繪製包裝，或上傳 Classroom。'][s.step];$('#prev').disabled=s.step===0;$('#next').hidden=s.step===4;$('#content').innerHTML=[page0,page1,page2,page3,page4][s.step]();bindFields();[setup0,()=>{},()=>{},setup3,setup4][s.step]();}
function roleCards(){return s.originalColors.map((c,i)=>`<div class="roleCard"><div class="roleHead"><strong class="mini">${['主色','輔色','點綴色'][i]}</strong><input type="color" value="${c}" data-orig="${i}" aria-label="${['主色','輔色','點綴色'][i]}"></div><button class="linkbtn" data-use="${i}">套用選取色</button><label class="mini">面積權重 <input type="number" min="0" max="100" step="1" style="width:100%;padding:6px;border:1px solid #ddd" data-ratio="${i}" value="${s.ratios[i]}"></label></div>`).join('')}
function ratioBar(colors,ratios){let sum=ratios.reduce((a,b)=>a+b,0)||1;return `<div class="ratio" role="img" aria-label="${ratios.map((v,i)=>`${['主色','輔色','點綴色'][i]} ${colors[i]} ${Math.round(v/sum*100)}%`).join('，')}">${colors.map((c,i)=>`<span style="background:${c};width:${ratios[i]/sum*100}%"></span>`).join('')}</div><div class="mini sub">${ratios.map((v,i)=>`${['主色','輔色','點綴色'][i]} ${Math.round(v/sum*100)}%`).join('　')}</div>`}
function page0(){return `<div class="grid"><section class="card"><h2>01 / 帶入商品照片</h2>${field('商品名稱','originalName',s.originalName,'例如：某品牌檸檬氣泡飲')}<label class="upload">選擇清楚、正面且背景單純的包裝照片<br><span class="sub">照片只在本機處理，不傳送到伺服器或 AI。支援瀏覽器可解讀的 JPG、PNG、WebP 等格式。</span><input id="photoInput" type="file" accept="image/*"></label>${s.photo?'<div class="photoWrap"><canvas id="photoCanvas" aria-label="商品照片，拖曳框選或切換點選取色"></canvas></div><div class="row" style="margin-top:12px"><button class="btn small" id="cropMode">拖曳框選</button><button class="btn small" id="pickMode">點選取色</button><button class="btn small" id="extract">擷取代表色</button><button class="linkbtn" id="resetCrop">全圖取色</button></div><p class="sub" id="cropStatus">框住包裝、避開背景，再擷取代表色。點選取色模式可精確選取局部顏色。</p>':'<div class="photoEmpty">從你選擇的一件商品開始。<br>也可以先用右側色票手動觀察。</div>'}</section><section class="card"><h2>02 / 分配顏色角色</h2><div class="guide"><strong>依面積與功能，辨識三種角色</strong>將建立包裝整體印象、占較大面積的顏色標為主色；配合主色、區分區塊的顏色標為輔色；少量出現且吸引目光的顏色標為點綴色。包裝不一定恰好只有三種顏色，先選最具代表性的三色。</div><h3>照片代表色</h3><div id="extractedPalette">${paletteHTML()}</div><div class="row" style="margin:15px 0"><span class="mini">目前選取</span><input type="color" id="selectedColor" value="${s.selectedColor}" aria-label="目前選取顏色"><code id="selectedHex">${s.selectedColor}</code></div><div class="grid3">${roleCards()}</div><div id="origBar">${ratioBar(s.originalColors,s.ratios)}</div><p class="sub">面積權重會換算為合計 100% 的估計比例。照片的陰影、反光與背景可能影響取色結果，請自行確認各色的角色。</p><details><summary>選用原包裝色票作為試色起點</summary><p class="note">將原包裝的三色與面積比例複製到指定方案，再依新口味或主題修改。這是選用功能，也可以直接在步驟 4 重新選色；兩個版本不必沿用原配色。</p><div class="row"><button class="btn small" data-copy-original="0">帶入方案 A</button><button class="btn small" data-copy-original="1">帶入方案 B</button></div></details></section></div>`}

function setup0(){ $('#photoInput').onchange=loadPhoto;$('#selectedColor').oninput=e=>{s.selectedColor=e.target.value;$('#selectedHex').textContent=s.selectedColor;save()};bindSwatches();$$('[data-orig]').forEach(e=>e.oninput=()=>{s.originalColors[+e.dataset.orig]=e.value;$('#origBar').innerHTML=ratioBar(s.originalColors,s.ratios);save()});$$('[data-use]').forEach(b=>b.onclick=()=>{s.originalColors[+b.dataset.use]=s.selectedColor;render();save()});$$('[data-ratio]').forEach(e=>e.oninput=()=>{s.ratios[+e.dataset.ratio]=Math.max(0,Math.min(100,Number(e.value)||0));$('#origBar').innerHTML=ratioBar(s.originalColors,s.ratios);save()});$$('[data-copy-original]').forEach(b=>b.onclick=()=>{let i=+b.dataset.copyOriginal;if(confirm(`以原包裝的三色與面積比例替換方案 ${i?'B':'A'} 的配色？已寫的版本設定與設計理由會保留。`)){let p=s.plans[i];p.colors=[...s.originalColors];p.colorNames=['','',''];p.ratios=[...s.ratios];save();toast(`已帶入方案 ${i?'B':'A'}，可到步驟 4 修改配色`)}});if(s.photo){const im=new Image();im.onload=()=>{img=im;drawPhoto();attachCanvas()};im.src=s.photo;$('#extract').onclick=extract;$('#resetCrop').onclick=()=>{crop=null;drawPhoto();extract()};$('#cropMode').onclick=()=>{pickMode=false;$('#cropStatus').textContent='拖曳框住包裝、避開背景，再按「擷取代表色」。'};$('#pickMode').onclick=()=>{pickMode=true;$('#cropStatus').textContent='點選照片中的顏色，再按「套用選取色」分配角色。'}}}
function bindSwatches(){$$('[data-swatch]').forEach(b=>b.onclick=()=>{s.selectedColor=s.palette[+b.dataset.swatch].hex;$('#selectedColor').value=s.selectedColor;$('#selectedHex').textContent=s.selectedColor;$('#extractedPalette').innerHTML=paletteHTML();bindSwatches();save()})}
async function loadPhoto(e){const file=e.target.files[0];if(!file)return;if(file.size>30*1024*1024){toast('請選擇小於 30 MB 的圖片');return}const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);s.photo=c.toDataURL('image/jpeg',.82);s.palette=[];crop=null;URL.revokeObjectURL(u);save();render();toast('照片已載入，請框選包裝範圍再擷取代表色')};im.onerror=()=>{URL.revokeObjectURL(u);toast('此圖片無法解讀，請改用 JPG 或 PNG')};im.src=u}
function drawPhoto(){let c=$('#photoCanvas');if(!c||!img)return;c.width=img.width;c.height=img.height;let x=c.getContext('2d');x.drawImage(img,0,0);if(crop){x.fillStyle='#14233860';x.fillRect(0,0,c.width,c.height);x.save();x.beginPath();x.rect(crop.x,crop.y,crop.w,crop.h);x.clip();x.drawImage(img,0,0);x.restore();x.strokeStyle='#ffce45';x.lineWidth=Math.max(2,c.width/220);x.strokeRect(crop.x,crop.y,crop.w,crop.h)}}
function attachCanvas(){let c=$('#photoCanvas');const pt=e=>{let b=c.getBoundingClientRect();return {x:Math.max(0,Math.min(c.width-1,(e.clientX-b.left)*c.width/b.width)),y:Math.max(0,Math.min(c.height-1,(e.clientY-b.top)*c.height/b.height))}};c.onpointerdown=e=>{e.preventDefault();c.setPointerCapture(e.pointerId);let p=pt(e);if(pickMode){let t=document.createElement('canvas');t.width=img.width;t.height=img.height;let x=t.getContext('2d');x.drawImage(img,0,0);s.selectedColor=rgbHex(...x.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data.slice(0,3));$('#selectedColor').value=s.selectedColor;$('#selectedHex').textContent=s.selectedColor;save();return}drag=p;crop=null;drawPhoto()};c.onpointermove=e=>{if(!drag)return;let p=pt(e);crop={x:Math.min(p.x,drag.x),y:Math.min(p.y,drag.y),w:Math.abs(p.x-drag.x),h:Math.abs(p.y-drag.y)};drawPhoto()};c.onpointerup=c.onpointercancel=()=>{drag=null;if(crop&&(crop.w<5||crop.h<5))crop=null;drawPhoto()}}
function rgbHex(r,g,b){return '#'+[r,g,b].map(x=>Math.round(x).toString(16).padStart(2,'0')).join('')}
function extract(){if(!img)return;let c=document.createElement('canvas');c.width=120;c.height=120;let x=c.getContext('2d'),r=crop||{x:0,y:0,w:img.width,h:img.height};x.drawImage(img,r.x,r.y,r.w,r.h,0,0,120,120);let d=x.getImageData(0,0,120,120).data,points=[];for(let i=0;i<d.length;i+=16)points.push([d[i],d[i+1],d[i+2]]);let centers=[points[0]];while(centers.length<6){let far=points[0],md=-1;for(let p of points){let dist=Math.min(...centers.map(c=>p.reduce((a,v,k)=>a+(v-c[k])**2,0)));if(dist>md){md=dist;far=p}}if(md<16)break;centers.push([...far])}let counts=[];for(let it=0;it<12;it++){let sums=centers.map(()=>[0,0,0]);counts=centers.map(()=>0);for(let p of points){let best=0,min=Infinity;centers.forEach((c,i)=>{let di=p.reduce((a,v,k)=>a+(v-c[k])**2,0);if(di<min){min=di;best=i}});counts[best]++;p.forEach((v,k)=>sums[best][k]+=v)}centers=centers.map((c,i)=>counts[i]?sums[i].map(v=>v/counts[i]):c)}s.palette=centers.map((c,i)=>({hex:rgbHex(...c),percent:Math.round(counts[i]/points.length*100)})).filter(p=>p.percent>0).sort((a,b)=>b.percent-a.percent);s.selectedColor=s.palette[0].hex;$('#extractedPalette').innerHTML=paletteHTML();$('#selectedColor').value=s.selectedColor;$('#selectedHex').textContent=s.selectedColor;bindSwatches();save();toast('已擷取代表色。請確認主色、輔色與點綴色。')}
const assoc=[['sense','感官聯想','依配色聯想酸甜、清淡、濃郁、清涼、溫暖或柔軟等感受。寫出顏色與感受之間的連結。',['清爽','濃郁','溫暖','柔和'],'例如：黃色搭配白色，讓我聯想到清爽、帶酸味的飲料。'],['audience','使用族群','想像這組配色可能吸引的年齡層、喜好與生活方式，再指出支持推測的色彩特徵。',['喜歡鮮明風格的人','偏好簡潔設計的人','喜歡柔和色調的人'],'例如：高彩度的對比色可能吸引喜歡醒目、活潑風格的消費者。'],['style','風格聯想','從活潑、可愛、自然、簡潔、復古、典雅或科技感等方向描述風格，連結實際色彩。',['活潑','自然','復古','典雅'],'例如：低彩度的褐色與米色，讓我聯想到樸實、復古的風格。'],['emotion','情緒與形象','記錄配色帶來的情緒，再延伸到商品形象，例如愉快有精神、安靜可靠或神祕。',['愉快','平靜','安心','神祕'],'例如：柔和的藍綠色使我感到平靜，商品形象偏向清新、放鬆。'],['temperature','冷暖感','觀察占大面積的顏色與周圍搭配，描述整體偏冷、偏暖或較中性，連結商品特色。',['偏冷','偏暖','較為中性'],'例如：橘黃色占最大面積，整體偏暖，呼應溫熱、香濃的感覺。']];

function hexHsl(hex){let a=hex.match(/\w\w/g).map(x=>parseInt(x,16)/255),max=Math.max(...a),min=Math.min(...a),d=max-min,h=0,l=(max+min)/2,st=0;if(d){st=d/(1-Math.abs(2*l-1));h=max===a[0]?((a[1]-a[2])/d)%6:max===a[1]?(a[2]-a[0])/d+2:(a[0]-a[1])/d+4;h*=60;if(h<0)h+=360}return [Math.round(h),Math.round(st*100),Math.round(l*100)]}
function hslHex(h,st,l){st/=100;l/=100;let c=(1-Math.abs(2*l-1))*st,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=h<60?[c,x,0]:h<120?[x,c,0]:h<180?[0,c,x]:h<240?[0,x,c]:h<300?[x,0,c]:[c,0,x];return rgbHex(...r.map(v=>(v+m)*255))}
function page3(){let p=s.plans[s.activePlan],r=s.activeRole,hsl=hexHsl(p.colors[r]);return `<div class="guide">${targetText()}<br>選出能呼應口味或主題的代表色，安排在易見的位置與足夠面積。以長條配色條比較主色、輔色與點綴色的比例；商品造型、圖案與品牌版面請在紙上自行發展。</div><section class="card"><div class="row spread"><h2>兩個方案並排觀察</h2><label style="margin:0"><input type="checkbox" id="gray" ${s.gray?'checked':''}> 灰階比較</label></div><div class="grid compare" id="previews">${s.plans.map((p,i)=>previewHTML(p,i)).join('')}</div><p class="sub">點選上方 A、B 卡片，選擇要編輯的方案。配色條會隨顏色與面積權重即時變化；灰階比較可協助觀察明暗。</p><div class="guide"><strong>將配色實際畫在作品上</strong>配色比例僅供設計參考，請將配色實際畫在作品上，依版面需要調整各色面積。下載筆記會保留彩色配色條。</div></section><div class="grid"><section class="card"><h2>正在編輯方案 ${s.activePlan?'B':'A'}</h2><p class="sub">${esc(p.version||'尚未設定口味或主題')} · 點選上方方案卡片可切換編輯。</p><label>選擇調整的顏色角色</label><div class="row">${p.colors.map((c,i)=>`<button class="swatch ${r===i?'selected':''}" data-role="${i}" style="flex:1"><span class="paint" style="background:${c}"></span>${['主色','輔色','點綴色'][i]}</button>`).join('')}</div><div class="row" style="margin-top:18px"><input type="color" id="editColor" value="${p.colors[r]}" aria-label="調整顏色"><code id="editHex">${p.colors[r]}</code></div>${field('色彩名稱','plans.'+s.activePlan+'.colorNames.'+r,p.colorNames[r],'例如：淡紫色、墨綠色、米白色')}<p class="sub">調整後請更新色名，使文字與畫面一致。</p>${['色相 H','彩度 S','明度 L'].map((n,i)=>`<div class="meter"><span>${n}</span><input type="range" id="hsl${i}" min="0" max="${i?100:360}" value="${hsl[i]}" aria-label="${n}"><output id="hslOut${i}">${hsl[i]}${i?'%':'°'}</output></div>`).join('')}<p class="sub">此處使用螢幕 HSL 模型比較變化，與實體顏料調色的結果可能不同。</p><div id="toneFeedback" class="toneTips">${toneFeedback(hsl)}</div><details open><summary>明度與彩度的觀察指引</summary><table class="hintTable"><tr><td>提高明度</td><td>觀察是否更輕盈、清爽或柔和。明亮且鮮豔時，也可能呈現活力。</td></tr><tr><td>降低明度</td><td>觀察是否更沉穩、厚重或神祕，嘗試連結成熟、濃郁或安靜的形象。</td></tr><tr><td>提高彩度</td><td>觀察是否更鮮明、活潑或強烈；將醒目的顏色用在需要吸引注意的位置。</td></tr><tr><td>降低彩度</td><td>觀察是否更柔和、樸實或內斂；用來減少刺激感、協調整體配色。</td></tr></table></details></section><section class="card"><h2>安排面積與設計理由</h2><p class="note">面積會改變整體印象。讓主色建立形象、輔色協調畫面、點綴色吸引目光。</p>${p.ratios.map((v,i)=>`<div class="meter"><span>${['主色','輔色','點綴色'][i]}</span><input type="range" data-pratio="${i}" min="1" max="100" value="${v}" aria-label="${['主色','輔色','點綴色'][i]}面積權重"><output id="pratio${i}">${v}</output></div>`).join('')}<div id="planBar">${ratioBar(p.colors,p.ratios)}</div>${field('主要色彩的效果','plans.'+s.activePlan+'.mainEffect',p.mainEffect,'我使用＿＿作為主色，透過＿＿的明度與＿＿的彩度，表現＿＿，呼應＿＿族群／情境。',true)}${field('搭配色彩與整體效果','plans.'+s.activePlan+'.mixEffect',p.mixEffect,'輔色＿＿用在＿＿，增加＿＿；點綴色＿＿集中於＿＿，使畫面＿＿。',true)}<div class="guide"><strong>依目標決定，不必追求數值高低</strong>明亮又鮮豔較容易表現活力；明亮但低彩度可能偏向柔和。綜合比較色相、深淺、鮮豔程度與面積，再選出符合你設定的族群及形象的配色。</div><button class="btn" id="copyPlan">將本方案色票複製到另一方案</button><p class="sub">這是選用功能；可先複製再修改，也可為不同口味或主題獨立選色。</p></section></div>`}

function setPlanColor(c,reset,hsl){s.plans[s.activePlan].colors[s.activeRole]=c;hsl=hsl||hexHsl(c);$('#editHex').textContent=c;$('#editColor').value=c;if(reset)[0,1,2].forEach(i=>$('#hsl'+i).value=hsl[i]);[0,1,2].forEach(i=>$('#hslOut'+i).textContent=hsl[i]+(i?'%':'°'));$$('[data-role] .paint')[s.activeRole].style.background=c;$('#toneFeedback').innerHTML=toneFeedback(hsl);updatePreviews();save()}

function page4(){let m=missing();return `<section class="card noprint"><div class="grid">${field('班級（選填）','className',s.className,'班級')}${field('姓名／座號（選填）','student',s.student,'姓名或座號')}</div><p class="note">${m.length?'尚可補充：'+m.join('、')+'。未填完也會產生圖片，保留目前進度。':'觀察與設計理由已填寫完成。請再確認色名、口味與圖面一致。'}</p><div class="row"><button class="btn" id="copyText">複製文字</button><button class="btn" id="backup2">下載可續編進度</button></div><div id="exportResult" class="export-result" role="status">正在產生可長按儲存的筆記圖片…</div><p class="sub">長按下方筆記圖片可儲存，用於參照與繳交；電腦可按右鍵另存圖片。進度 JSON 可匯入本頁繼續編輯。頁面暫存與照片均保留在此瀏覽器，不會同步給老師。</p></section><details class="report-text"><summary>查看文字版筆記</summary><article class="report" id="report"><div class="eyebrow">MY PACKAGING COLOR PLAN</div><h2>我的包裝配色計畫</h2><p id="reportStudent">${esc([s.className,s.student].filter(Boolean).join("　")||"基本設計｜生活中的色彩")}</p><h3>01 / 原包裝觀察：${val(s.originalName)}</h3>${s.photo?`<img src="${s.photo}" alt="我的原包裝照片" style="max-width:220px;max-height:220px;object-fit:contain">`:''}${ratioBar(s.originalColors,s.ratios)}${assoc.map(([k,t])=>`<p><strong>${t}</strong>｜${val(s.associations[k])}</p>`).join('')}<h3>02 / 新版本與設計目標</h3><div class="grid compare">${s.plans.map((p,i)=>`<section><h3>方案 ${i?'B':'A'}｜${val(p.version)}</h3><p>使用族群：${val(p.audience)}<br>使用情境：${val(p.scene)}<br>設計形象：${val(p.intent)}</p>${previewHTML(p,i,false)}<p><strong>商品命名</strong>｜${val(p.name)}</p><p>${esc(planDescription(p))}</p></section>`).join('')}</div><div class="guide"><strong>接下來，帶回紙上完成設計</strong>配色比例僅供設計參考。請將配色實際畫在作品上，依版面需要調整各色面積，再加入品牌、商品圖像與版面安排，對照作品修正設計理由。</div></article></details>`}
function reportText(){return `我的包裝配色計畫\n${s.className} ${s.student}\n\n原包裝：${s.originalName}\n${assoc.map(([k,t])=>`${t}：${s.associations[k]||'尚未填寫'}`).join('\n')}\n\n${s.plans.map((p,i)=>`方案 ${i?'B':'A'}｜${p.version}\n使用族群：${p.audience}\n使用情境：${p.scene}\n設計形象：${p.intent}\n商品命名：${p.name}\n${planDescription(p)}`).join('\n\n')}`}
function setup4(){scheduleNoteImage(0);$('#copyText').onclick=async()=>{try{await navigator.clipboard.writeText(reportText());toast('已複製設計說明')}catch(e){toast('無法自動複製，請長按或選取下方文字')}};$('#backup2').onclick=backup}
function download(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function backup(){download(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),'包裝配色實驗室-進度.json');toast('已下載進度檔，可在其他裝置匯入')}
let noteRenderRevision=0,noteRenderTimer;
function scheduleNoteImage(delay=0){clearTimeout(noteRenderTimer);const revision=++noteRenderRevision;const result=$('#exportResult');if(result){result.classList.add('updating');result.setAttribute('aria-busy','true')}noteRenderTimer=setTimeout(()=>renderNoteImage(revision),delay)}
async function renderNoteImage(revision){const result=$('#exportResult');if(!result||s.step!==4)return;try{
const data=JSON.parse(JSON.stringify(s)),measure=document.createElement('canvas').getContext('2d');if(!measure)throw Error('canvas');const commands=[];let y=65;const text=(t,size=25,color='#243445',bold=false)=>{const font=`${bold?'bold ':''}${size}px system-ui,sans-serif`;measure.font=font;for(const para of String(t).split('\n')){let line='';for(const ch of para){if(measure.measureText(line+ch).width>1250){commands.push({type:'text',value:line,x:70,y,font,color});y+=size*1.65;line=''}line+=ch}commands.push({type:'text',value:line,x:70,y,font,color});y+=size*1.65}};
const bars=(cs,rs)=>{let sum=rs.reduce((a,b)=>a+b,0)||1,pos=70;cs.forEach((color,i)=>{let w=1260*rs[i]/sum;commands.push({type:'rect',x:pos,y,w,h:35,color});pos+=w});y+=70;text(rs.map((v,i)=>`${['主色','輔色','點綴色'][i]} ${Math.round(v/sum*100)}% (${cs[i]})`).join('　'),21)};
text('我的包裝配色計畫',48,'#3056d3',true);text([data.className,data.student].filter(Boolean).join('　')||'基本設計｜生活中的色彩',24);y+=20;text('01 / 原包裝觀察：'+(data.originalName||'尚未命名'),31,'#243445',true);
if(data.photo){const im=await loadImage(data.photo);let h=260,w=im.width/im.height*h;if(w>550){w=550;h=im.height/im.width*w}commands.push({type:'image',im,x:70,y,w,h});y+=h+35}
bars(data.originalColors,data.ratios);assoc.forEach(([k,t])=>text(t+'：'+(data.associations[k]||'尚未填寫')));y+=35;text('02 / 新版本與設計目標',31,'#3056d3',true);
for(let i=0;i<2;i++){const p=data.plans[i];y+=35;text(`方案 ${i?'B':'A'}｜${p.version||'尚未設定口味或主題'}`,34,'#3056d3',true);text('使用族群：'+(p.audience||'尚未填寫'));text('使用情境：'+(p.scene||'尚未填寫'));text('設計形象：'+(p.intent||'尚未填寫'));bars(p.colors,p.ratios);text('商品命名：'+(p.name||'尚未填寫'),27,'#243445',true);text(planDescription(p))}
y+=35;text('配色比例僅供設計參考。請將配色實際畫在作品上，依版面需要調整各色面積。',23,'#657080');text('MerMer room · 包裝配色實驗室',20,'#657080');
const height=Math.ceil(y+35),scale=Math.min(1,Math.sqrt(8000000/(1400*height)),4096/height),c=document.createElement('canvas');c.width=Math.ceil(1400*scale);c.height=Math.ceil(height*scale);const x=c.getContext('2d');if(!x)throw Error('canvas');x.fillStyle='#f7f6f2';x.fillRect(0,0,c.width,c.height);x.scale(scale,scale);
for(const cmd of commands){if(cmd.type==='text'){x.font=cmd.font;x.fillStyle=cmd.color;x.fillText(cmd.value,cmd.x,cmd.y)}else if(cmd.type==='rect'){x.fillStyle=cmd.color;x.fillRect(cmd.x,cmd.y,cmd.w,cmd.h)}else{x.drawImage(cmd.im,cmd.x,cmd.y,cmd.w,cmd.h)}}
if(revision!==noteRenderRevision||!result.isConnected||s.step!==4)return;
const imageData=c.toDataURL('image/png');if(!imageData.startsWith('data:image/png;base64,'))throw Error('encode');result.textContent='';
const heading=document.createElement('h2');heading.textContent='長按圖片，儲存設計筆記';result.appendChild(heading);
const message=document.createElement('p');message.textContent='下方是完整 PNG 圖片。手機請直接長按圖片，選擇「儲存影像」或「下載圖片」；電腦可按右鍵另存。填寫班級或姓名後，圖片會自動更新。';result.appendChild(message);
const preview=document.createElement('img');preview.id='noteImage';preview.src=imageData;preview.alt='我的包裝配色計畫，長按此圖片儲存';preview.draggable=false;preview.className='saveable-note';preview.width=c.width;preview.height=c.height;result.appendChild(preview);
try{sessionStorage.setItem('mermer-note-image',imageData);const link=document.createElement('a');link.href='save-note.html';link.className='linkbtn';link.textContent='開啟純圖片頁，放大或長按儲存';result.appendChild(link)}catch(e){}
const hint=document.createElement('p');hint.className='sub';hint.textContent='若 ChatGPT 或其他 App 的內建預覽沒有顯示長按選單，請用 Safari／Chrome 開啟本網站，再進入「設計筆記」儲存圖片。';result.appendChild(hint);c.width=1;c.height=1;
}catch(e){if(revision===noteRenderRevision&&result.isConnected)result.textContent='圖片未能產生。請重新進入「設計筆記」再試一次，或先下載可續編進度以保留內容。'}finally{if(revision===noteRenderRevision&&result.isConnected){result.classList.remove('updating');result.setAttribute('aria-busy','false')}}}

function loadImage(src){return new Promise((resolve,reject)=>{const im=new Image(),timer=setTimeout(()=>reject(Error('image timeout')),10000);im.onload=()=>{clearTimeout(timer);resolve(im)};im.onerror=()=>{clearTimeout(timer);reject(Error('image load'))};im.src=src})}
$('#prev').onclick=()=>go(s.step-1);$('#next').onclick=()=>go(s.step+1);$('#backup').onclick=backup;$('#restoreBtn').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>6*1024*1024)throw Error();let a=JSON.parse(await f.text());if((a.v!==1&&a.v!==2)||!Array.isArray(a.plans)||a.plans.length!==2||!a.associations||!Array.isArray(a.originalColors)||a.originalColors.length!==3)throw Error();let validHex=c=>/^#[0-9a-f]{6}$/i.test(c),validRatio=r=>Array.isArray(r)&&r.length===3&&r.every(n=>typeof n==='number'&&n>=0&&n<=100);if(!a.originalColors.every(validHex)||!validRatio(a.ratios)||!validHex(a.selectedColor)||!Array.isArray(a.palette)||a.palette.some(p=>!validHex(p.hex)||typeof p.percent!=='number'||p.percent<0||p.percent>100)||a.plans.some(p=>!Array.isArray(p.colors)||p.colors.length!==3||!p.colors.every(validHex)||!Array.isArray(p.colorNames)||p.colorNames.length!==3||p.colorNames.some(n=>typeof n!=='string')||!validRatio(p.ratios)))throw Error();let base=defaults();for(let key of ['originalName','student','className'])if(typeof a[key]!=='string')throw Error();if(Object.values(a.associations).some(v=>typeof v!=='string'))throw Error();if(a.plans.some(p=>['intent','name','mainEffect','mixEffect'].some(k=>typeof p[k]!=='string')))throw Error();if(a.photo&&!/^data:image\/(jpeg|png|webp);base64,/.test(a.photo))throw Error();a=normalizeProgress(a);if(a.plans.some(p=>['version','audience','scene'].some(k=>typeof p[k]!=='string')))throw Error();if(confirm('匯入後會替換此瀏覽器的現有進度，請先確認已備份。')){s={...a,step:0,activePlan:0,activeRole:0,gray:false};crop=null;save();render();toast('已匯入進度')}}catch(err){toast('無法讀取此進度檔，請選擇本頁匯出的 JSON 檔')}e.target.value=''};
$('#clearBtn').onclick=()=>{if(confirm('清除這台裝置此瀏覽器的所有填寫內容與照片？此操作無法復原，請先下載進度檔。')){s=defaults();crop=null;img=null;try{localStorage.removeItem(KEY)}catch(e){}render();$('#saveStatus').textContent='已清除本機紀錄'}};
$('#demoBtn').onclick=()=>{if(!confirm('載入示範會替換目前內容，請先下載進度檔保留自己的設計。'))return;s=defaults();s.originalName='泡泡・檸檬氣泡飲（虛構示範）';s.associations={sense:'黃色與白色讓我聯想到清爽、帶酸味的檸檬飲料。',audience:'明亮配色可能吸引喜歡清新果味、活潑風格的消費者。',style:'黃色面積最大，搭配白色與綠色，風格明亮、自然。',emotion:'明亮的黃色讓我感到愉快、有精神。',temperature:'黃色占大面積，因此整體偏暖；白色與綠色增加清新感。'};s.plans[0].version='葡萄氣泡飲';s.plans[0].audience='喜歡鮮明果味與活潑風格的消費者';s.plans[0].scene='運動後或出遊時飲用';s.plans[1].version='蜜桃氣泡飲';s.plans[1].audience='喜歡柔和色調與甜美果味的消費者';s.plans[1].scene='午後休息時飲用';s.plans[0].intent='清爽活力';s.plans[0].name='泡泡・輕盈葡萄';s.plans[0].mainEffect='以淡紫色呼應葡萄，較高明度呈現輕盈感。';s.plans[0].mixEffect='米白色增加留白與明亮感；少量鮮明黃綠色形成對比，增加活力。';s.plans[1].intent='柔和甜美';s.plans[1].name='泡泡・柔桃時光';s.plans[1].colors=['#edb8ad','#fff7ec','#77945f'];s.plans[1].colorNames=['蜜桃粉色','奶油白色','灰綠色'];s.plans[1].mainEffect='以高明度、較柔和的蜜桃粉色呼應蜜桃口味，表現甜美、親切的形象。';s.plans[1].mixEffect='奶油白色增加柔和與留白；少量灰綠色作為點綴，呼應果實與葉片的自然感。';s.step=3;crop=null;save();render();toast('已載入示範，可調整色票觀察差異')};
document.addEventListener('click',e=>{let b=e.target.closest('[data-add]');if(b){let k=b.dataset.add;s.associations[k]+=(s.associations[k]?'、':'')+b.dataset.word;let el=document.querySelector('[data-key="associations.'+k+'"]');if(el)el.value=s.associations[k];save()}});
